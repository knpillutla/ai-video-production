apiVersion: apps/v1
kind: Deployment
metadata:
  name: cineai-studio-api
  namespace: cineai-prod
  labels:
    app: cineai-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cineai-api
  template:
    metadata:
      labels:
        app: cineai-api
    spec:
      containers:
        - name: api
          image: gcr.io/cineai-studio-prod/studio-api:v2.0.0
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: STORAGE_BACKEND
              value: "gcs"
            - name: GCS_BUCKET_NAME
              value: "cineai-studio-vault-prod"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cineai-studio-service
  namespace: cineai-prod
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: cineai-api
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cineai-render-worker-scaler-gcp
  namespace: cineai-prod
spec:
  scaleTargetRef:
    name: cineai-render-worker
  minReplicaCount: 0
  maxReplicaCount: 500
  triggers:
    - type: gcp-pubsub
      metadata:
        subscriptionName: render-tasks-sub
        subscriptionSize: "5"
