<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    background: transparent !important;
    margin: 0;
    padding: 0;
    width: 3400px;
    height: 242px;
    overflow: hidden;
  }
  .text-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    text-align: center;
    font-family: 'Nirmala UI', 'Mandali', 'Ramabhadra', sans-serif;
    font-size: 110px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.95);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="text-container">దసరా డప్పు దుమ్ము (Dussehra Dappu Dummu)</div>
</body>
</html>
