<!-- TOP APP NAVIGATION BAR (CLEAN SAAS DENSE) -->
<header class="h-11 border-b border-[var(--border)] bg-[var(--header-bg)] flex items-center justify-between px-3.5 shrink-0 z-30">
  <div class="flex items-center gap-3">
    <!-- Sidebar Collapse Toggle Button -->
    <button onclick="toggleSidebarCollapse()" class="p-1.5 text-[var(--text-muted)] hover:text-[var(--text)] rounded-lg hover:bg-[var(--card-hover)] transition" title="Collapse / Expand Sidebar Menu">
      <i class="fa-solid fa-bars text-xs"></i>
    </button>

    <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('studio')" title="Open Production Studio">
      <div class="w-6 h-6 rounded-lg bg-[var(--accent)] flex items-center justify-center shadow-sm">
        <i class="fa-solid fa-clapperboard text-white text-[11px]"></i>
      </div>
      <div>
        <span class="font-black text-sm text-[var(--text)] tracking-tight">CineAI Studio</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <!-- Top Create Video Button -->
    <button onclick="openCreateVideoWizardModal()" id="btn-top-create-video" class="btn-runway-primary py-1 px-3 text-xs shadow-sm">
      <i class="fa-solid fa-plus text-[10px]"></i>
      <span>New Video</span>
    </button>

    <!-- Live Log Console Toggle -->
    <button onclick="toggleLogConsoleDrawer()" id="btn-top-log-console" class="btn-runway-secondary py-1 px-2.5 text-xs" title="Toggle Real-Time Production Log Console (Ctrl+`)">
      <i class="fa-solid fa-terminal text-[10px] text-[var(--text-muted)]"></i>
      <span>Console</span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
    </button>

    <!-- Theme Switcher -->
    <button onclick="toggleTheme()" class="btn-runway-secondary py-1 px-2.5 text-xs" title="Toggle Theme">
      <i id="theme-toggle-icon" class="fa-solid fa-circle-half-stroke text-[var(--text-muted)] text-[10px]"></i>
      <span id="theme-toggle-label">Theme</span>
    </button>

    <!-- Settings Button -->
    <button onclick="openModal('settings-modal')" class="btn-runway-secondary p-1.5 text-xs" title="User Settings">
      <i class="fa-solid fa-gear text-xs text-[var(--text-muted)]"></i>
    </button>

    <!-- Credits Wallet -->
    <div class="px-2.5 py-1 bg-[var(--card-subtle)] border border-[var(--border)] rounded-lg text-xs flex items-center gap-1.5 font-mono text-[var(--text)]">
      <i class="fa-solid fa-wallet text-[var(--text-muted)] text-[10px]"></i>
      <span id="user-credit-display" class="font-bold">$10.00 USD</span>
    </div>

    <!-- User Profile Badge -->
    <div onclick="openAuthOrProfileModal()" class="flex items-center gap-1.5 px-2.5 py-0.5 bg-[var(--card)] border border-[var(--border)] rounded-lg cursor-pointer hover:border-[var(--accent)] transition" title="Google Account Profile">
      <div id="user-avatar-display" class="w-5 h-5 rounded-full bg-[var(--card-subtle)] text-[var(--text)] font-bold text-[9px] flex items-center justify-center border border-[var(--border)]">KP</div>
      <span id="user-name-display" class="font-semibold text-[var(--text)] text-xs">Krishna P.</span>
    </div>
  </div>
</header>
