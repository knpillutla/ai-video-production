<!-- TOP APP NAVIGATION BAR -->
<header class="h-16 border-b border-[var(--border)] bg-[#0d1322] flex items-center justify-between px-5 shrink-0 z-30">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('studio')">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-clapperboard text-white text-base"></i>
      </div>
      <div>
        <span class="font-black text-base text-white tracking-tight">CineAI Studio</span>
        <span class="text-[9px] font-bold px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded ml-1">RUNWAY</span>
      </div>
    </div>
    <div class="hidden md:flex items-center gap-2 px-3 py-1 bg-slate-900/60 border border-[var(--border)] rounded-full text-xs text-gray-300">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Universe: <strong class="text-white">Delhi WFH Confusions</strong></span>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Top Create Video Button (Required by tests and user) -->
    <button onclick="openCreateVideoWizardModal()" id="btn-top-create-video" class="px-4 py-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 flex items-center gap-2 transition active:scale-95">
      <i class="fa-solid fa-plus text-xs"></i>
      <span>Create New Video</span>
    </button>

    <!-- Theme Switcher -->
    <button onclick="toggleTheme()" class="px-3 py-1.5 bg-slate-800/80 hover:bg-slate-700 border border-[var(--border)] text-xs rounded-xl text-gray-200 transition flex items-center gap-1.5" title="Toggle Theme">
      <i id="theme-toggle-icon" class="fa-solid fa-circle-half-stroke text-indigo-400"></i>
      <span id="theme-toggle-label">Theme</span>
    </button>

    <!-- Settings Button -->
    <button onclick="openModal('settings-modal')" class="p-2 bg-slate-800/80 hover:bg-slate-700 border border-[var(--border)] rounded-xl text-gray-300 hover:text-white transition" title="User Settings & Preferences">
      <i class="fa-solid fa-gear text-xs"></i>
    </button>

    <!-- Credits Wallet -->
    <div class="px-3 py-1.5 bg-emerald-950/40 border border-emerald-500/30 rounded-xl text-xs flex items-center gap-2 font-mono">
      <i class="fa-solid fa-wallet text-emerald-400"></i>
      <span id="user-credit-display" class="font-bold text-emerald-400">$10.00 USD</span>
    </div>

    <!-- User Profile Badge / Google Sign In -->
    <div onclick="openModal('auth-modal')" class="flex items-center gap-2.5 px-3 py-1 bg-slate-800/80 border border-[var(--border)] rounded-xl cursor-pointer hover:border-indigo-500/60 transition" title="Google Account Profile">
      <img id="user-avatar-display" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80" alt="Avatar" class="w-6 h-6 rounded-full border border-indigo-400">
      <span id="user-name-display" class="font-semibold text-white text-xs">Krishna P.</span>
      <i class="fa-solid fa-angle-down text-[10px] text-gray-400"></i>
    </div>
  </div>
</header>
