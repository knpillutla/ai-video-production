<!-- AUTH MODAL: Google Sign-In & User Persistence -->
<div id="auth-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl">
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
      <h3 class="font-black text-white text-base flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-indigo-400"></i>
        <span>Google Sign-In & Profile</span>
      </h3>
      <button onclick="closeModal('auth-modal')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="space-y-4">
      <button onclick="loginWithGoogle()" class="w-full py-2.5 bg-white text-slate-900 font-bold rounded-xl flex items-center justify-center gap-3 hover:bg-gray-100 transition shadow">
        <i class="fa-brands fa-google text-red-500 text-base"></i>
        <span>Sign in with Google</span>
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-3 text-gray-400 text-[10px] uppercase font-bold">Or Fast Dev Login</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-gray-400 text-xs font-semibold mb-1">Display Name</label>
          <input type="text" id="auth-name-input" value="Krishna P." class="w-full px-3 py-2 bg-slate-900 border border-[var(--border)] rounded-lg text-white text-xs">
        </div>
        <div>
          <label class="block text-gray-400 text-xs font-semibold mb-1">Email Address</label>
          <input type="email" id="auth-email-input" value="creator@cineai.studio" class="w-full px-3 py-2 bg-slate-900 border border-[var(--border)] rounded-lg text-white text-xs">
        </div>
        <button onclick="loginWithDevAccount()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition">
          Save & Authenticate Profile
        </button>
      </div>
    </div>
  </div>
</div>
