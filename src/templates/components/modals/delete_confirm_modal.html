<!-- ARTIFACT & EPISODE DELETION CONFIRMATION MODAL -->
<div id="delete-confirm-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden" onclick="if (event.target === this) closeDeleteConfirmModal();">
  <div class="bg-[var(--card)] border border-rose-500/40 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl text-center relative animate-in fade-in zoom-in-95 duration-150">
    <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 mx-auto flex items-center justify-center text-xl border border-rose-500/30 shadow-sm">
      <i class="fa-solid fa-trash-can"></i>
    </div>
    <div class="space-y-1">
      <h3 id="delete-confirm-title" class="text-base font-black text-slate-900 dark:text-white">Confirm Deletion</h3>
      <p id="delete-confirm-message" class="text-xs text-slate-600 dark:text-gray-300 leading-relaxed">Are you sure you want to permanently delete this episode from disk?</p>
    </div>

    <!-- Scoped Details Card (Format, Production Name, Episode) -->
    <div class="p-3 bg-slate-100 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-xl text-left space-y-2 text-xs">
      <div class="flex items-center justify-between text-[11px]">
        <span class="text-slate-500 font-semibold">Format:</span>
        <span id="delete-confirm-format" class="font-mono font-bold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20">Documentary</span>
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span class="text-slate-500 font-semibold">Series / Name:</span>
        <span id="delete-confirm-production" class="font-mono font-bold text-slate-800 dark:text-slate-200 truncate max-w-[210px]">Geneva Tour</span>
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span class="text-slate-500 font-semibold">Episode:</span>
        <span id="delete-confirm-episode-id" class="font-mono font-bold text-rose-600 dark:text-rose-400">EP-001</span>
      </div>
      <div id="delete-confirm-artifact-box" class="pt-1.5 border-t border-slate-200 dark:border-slate-800">
        <span class="text-[10px] text-slate-400 block mb-0.5">Title:</span>
        <div id="delete-confirm-artifact-name" class="font-mono text-[11px] text-slate-700 dark:text-slate-300 font-medium truncate">Episode Title</div>
      </div>
    </div>

    <div class="pt-1 flex items-center justify-end gap-2.5">
      <button type="button" onclick="closeDeleteConfirmModal()" class="btn-runway-secondary py-2 px-4 text-xs font-bold">
        Cancel
      </button>
      <button type="button" id="btn-delete-confirm-action" onclick="executeDeleteConfirmAction()" class="btn-runway-primary py-2 px-5 text-xs bg-rose-600 hover:bg-rose-500 text-white font-bold shadow-lg shadow-rose-600/30 flex items-center gap-1.5 transition active:scale-95">
        <i class="fa-solid fa-trash-can text-[10px]"></i>
        <span>Confirm Delete</span>
      </button>
    </div>
  </div>
</div>
