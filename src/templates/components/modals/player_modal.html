<!-- VIDEO PLAYER MODAL: Play Master Rendered Video -->
<div id="video-player-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-[var(--card)] border border-indigo-500/40 rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl relative">
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-play"></i>
        </div>
        <div>
          <h3 id="player-modal-title" class="font-black text-white text-base">Video Master Player</h3>
          <p id="player-modal-meta" class="text-[11px] text-gray-400">1080p Master Render • Single-Pass Audio Ducking</p>
        </div>
      </div>
      <button onclick="closeVideoPlayerModal()" class="text-gray-400 hover:text-white text-base">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Video Canvas / Player -->
    <div class="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center border border-slate-800">
      <video id="player-modal-video" controls preload="none" class="w-full h-full object-contain"></video>
    </div>

    <!-- Details and Quick YouTube Action -->
    <div class="flex items-center justify-between pt-1 text-xs">
      <div class="space-y-0.5">
        <span class="text-gray-400">Status: <strong class="text-emerald-400">Render Complete</strong></span>
        <div id="player-modal-cost" class="font-mono text-[11px] text-indigo-300">Cost: $0.0200 USD</div>
      </div>
      <div class="flex items-center gap-2">
        <a id="player-modal-download-btn" href="/static/videos/preview_master.mp4" download="master_render.mp4" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-200 hover:text-white rounded-xl font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-download"></i>
          <span>Download MP4</span>
        </a>
        <button id="player-modal-publish-btn" onclick="publishCurrentPlayingVideo()" class="px-5 py-2 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold rounded-xl shadow-lg flex items-center gap-1.5 transition">
          <i class="fa-brands fa-youtube"></i>
          <span>Publish to YouTube</span>
        </button>
      </div>
    </div>
  </div>
</div>
