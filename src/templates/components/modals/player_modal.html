<!-- UNIVERSAL MEDIA ARTIFACT VIEWER MODAL (Video & Photo 4K Fullscreen Player) -->
<div id="video-player-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-3 sm:p-4 hidden" onclick="if (event.target === this) closeVideoPlayerModal();">
  <div class="bg-[var(--card)] border border-indigo-500/40 rounded-2xl max-w-4xl w-full p-4 sm:p-5 space-y-3 shadow-2xl relative flex flex-col max-h-[92vh]">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-2.5">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="player-modal-icon-container" class="w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-sm shrink-0 border border-indigo-500/30">
          <i id="player-modal-icon" class="fa-solid fa-play"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h3 id="player-modal-title" class="font-black text-slate-900 dark:text-white text-sm sm:text-base truncate">Artifact Viewer</h3>
            <span id="player-modal-badge" class="px-2 py-0.5 rounded-full text-[9px] font-mono font-bold bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border border-indigo-500/30 shrink-0">4K UHD</span>
          </div>
          <p id="player-modal-meta" class="text-[11px] text-slate-500 dark:text-gray-400 truncate mt-0.5">4K Master Render • Single-Pass Lossless</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="toggleModalMediaFullscreen()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-gray-200 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow-sm" title="Expand to Full Screen">
          <i class="fa-solid fa-expand text-[10px] text-indigo-500"></i>
          <span class="hidden sm:inline">Full Screen</span>
        </button>
        <button type="button" onclick="closeVideoPlayerModal()" class="text-slate-400 hover:text-slate-900 dark:hover:text-white text-base p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Close (Esc)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Media Canvas / Player -->
    <div id="player-modal-media-container" class="relative rounded-xl overflow-hidden bg-black aspect-video flex-1 flex items-center justify-center border border-slate-800 shadow-inner group">
      <video id="player-modal-video" controls playsinline preload="auto" class="w-full h-full object-contain"></video>
      <img id="player-modal-image" class="w-full h-full object-contain hidden" alt="Artifact preview">
    </div>

    <!-- Footer Controls & Actions -->
    <div class="flex items-center justify-between pt-1 text-xs flex-wrap gap-2">
      <div class="space-y-0.5 min-w-0">
        <span class="text-slate-600 dark:text-gray-400 text-[11px]">Artifact Status: <strong class="text-emerald-600 dark:text-emerald-400 font-mono">Render Complete (Verified)</strong></span>
        <div id="player-modal-cost" class="font-mono text-[10px] text-indigo-600 dark:text-indigo-300 truncate">Autonomous AI Production Master</div>
      </div>
      <div class="flex items-center gap-2">
        <a id="player-modal-download-btn" href="/static/videos/preview_master.mp4" download="artifact_media" target="_blank" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-gray-200 rounded-xl font-bold flex items-center gap-1.5 transition text-xs shadow-sm">
          <i class="fa-solid fa-download text-[10px]"></i>
          <span>Download</span>
        </a>
        <button id="player-modal-publish-btn" onclick="publishCurrentPlayingVideo()" class="px-4 py-1.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold rounded-xl shadow flex items-center gap-1.5 transition text-xs">
          <i class="fa-brands fa-youtube"></i>
          <span>Publish</span>
        </button>
      </div>
    </div>
  </div>
</div>
