<!-- MODAL: EPISODE STORY & SCREENPLAY SCRIPT VIEWER -->
<div id="episode-script-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-[var(--card)] border border-indigo-500/40 rounded-2xl max-w-3xl w-full p-5 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-2.5">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xs">
          <i class="fa-solid fa-scroll"></i>
        </div>
        <div>
          <h3 id="script-modal-title" class="font-black text-white text-sm">Episode Story &amp; Screenplay Script</h3>
          <p id="script-modal-subtitle" class="text-[10px] text-gray-400 font-mono">Channel • Episode ID</p>
        </div>
      </div>
      <button onclick="closeModal('episode-script-modal')" class="text-gray-400 hover:text-white text-sm p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Story Topic Banner -->
    <div class="p-3 bg-indigo-950/30 border border-indigo-500/30 rounded-xl space-y-1">
      <div class="text-[10px] uppercase font-bold text-indigo-400 flex items-center gap-1.5">
        <i class="fa-solid fa-lightbulb"></i>
        <span>Story Premise &amp; Directorial Topic:</span>
      </div>
      <p id="script-modal-topic" class="text-xs font-semibold text-white"></p>
    </div>

    <!-- Full Screenplay / Script Content -->
    <div class="space-y-1.5">
      <div class="flex items-center justify-between text-[11px] text-gray-400">
        <span class="font-bold text-white flex items-center gap-1.5">
          <i class="fa-solid fa-film text-purple-400"></i>
          <span>Multi-Shot Storyboard &amp; Cinematic Prompts:</span>
        </span>
        <button onclick="copyScriptContent()" class="text-indigo-400 hover:text-indigo-300 font-bold flex items-center gap-1 text-[11px]">
          <i class="fa-regular fa-copy"></i> Copy Script
        </button>
      </div>
      <pre id="script-modal-text" class="w-full p-3 bg-slate-950 border border-[var(--border)] rounded-xl text-gray-200 font-mono text-[11px] whitespace-pre-wrap leading-relaxed max-h-[50vh] overflow-y-auto custom-scrollbar select-all"></pre>
    </div>

    <!-- Bottom Actions -->
    <div class="flex items-center justify-end gap-2 pt-2 border-t border-[var(--border)]">
      <button onclick="copyScriptContent()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs flex items-center gap-1.5 shadow">
        <i class="fa-regular fa-copy text-xs"></i>
        <span>Copy Screenplay</span>
      </button>
      <button onclick="closeModal('episode-script-modal')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold rounded-lg text-xs">
        <span>Close</span>
      </button>
    </div>
  </div>
</div>
