<!-- MODAL: EPISODE STORY & SCREENPLAY SCRIPT DRAWER -->
<div id="studio-script-drawer-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-3 sm:p-4 hidden">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-4xl w-full p-4 sm:p-5 space-y-3 shadow-2xl relative max-h-[92vh] flex flex-col custom-scrollbar">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-2.5 shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-sm font-bold shrink-0 border border-amber-500/30">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="script-drawer-ep-id" class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-600 dark:text-amber-400 font-mono text-[11px] font-bold border border-amber-500/30">EP-001</span>
            <h3 id="script-drawer-title" class="font-black text-slate-900 dark:text-white text-sm truncate">Episode Story &amp; Screenplay</h3>
          </div>
          <p id="script-drawer-story" class="text-[10px] text-slate-500 dark:text-gray-400 font-medium truncate mt-0.5">Authoritative 360° Sovereign Dossier</p>
        </div>
      </div>
      <button onclick="closeScriptDrawer()" class="text-slate-400 hover:text-slate-900 dark:hover:text-white text-base p-1.5 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Meta Chips Bar -->
    <div class="flex items-center gap-1.5 flex-wrap text-[10px] font-mono shrink-0">
      <span id="script-drawer-cluster" class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-gray-300 font-semibold border border-[var(--border)]">Cluster: Documentary</span>
      <span id="script-drawer-fps" class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-gray-300 font-semibold border border-[var(--border)]">24 FPS Cinematic</span>
      <span id="script-drawer-scenes-count" class="px-2 py-0.5 rounded-full bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 font-semibold border border-purple-300 dark:border-purple-800">5 Chapters</span>
      <span id="script-drawer-audio-tags" class="px-2 py-0.5 rounded-full bg-cyan-100 dark:bg-cyan-950/60 text-cyan-700 dark:text-cyan-300 font-semibold border border-cyan-300 dark:border-cyan-800 truncate max-w-xs">Acoustic Score</span>
    </div>

    <!-- Tabs Header -->
    <div class="flex items-center gap-1 p-1 bg-slate-100 dark:bg-slate-900/90 rounded-xl border border-[var(--border)] text-[10px] shrink-0 overflow-x-auto custom-scrollbar">
      <button type="button" id="btn-script-tab-story" onclick="switchScriptDrawerTab('story')" class="flex-1 py-1 px-2 font-bold rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
        <i class="fa-solid fa-book"></i>
        <span>Story (Chapters)</span>
      </button>
      <button type="button" id="btn-script-tab-visual" onclick="switchScriptDrawerTab('visual')" class="flex-1 py-1 px-2 font-bold rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
        <i class="fa-solid fa-clapperboard"></i>
        <span>Screenplay (Shots)</span>
      </button>
      <button type="button" id="btn-script-tab-inputs" onclick="switchScriptDrawerTab('inputs_json')" class="flex-1 py-1 px-2 font-medium rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
        <i class="fa-solid fa-sliders"></i>
        <span>user_inputs.json</span>
      </button>
      <button type="button" id="btn-script-tab-screenplay" onclick="switchScriptDrawerTab('screenplay_json')" class="flex-1 py-1 px-2 font-medium rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
        <i class="fa-solid fa-file-code"></i>
        <span>screenplay.json</span>
      </button>
      <button type="button" id="btn-script-tab-pipeline" onclick="switchScriptDrawerTab('pipeline_json')" class="flex-1 py-1 px-2 font-medium rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
        <i class="fa-solid fa-gears"></i>
        <span>pipeline_state.json</span>
      </button>
      <button type="button" id="btn-script-tab-manifest" onclick="switchScriptDrawerTab('manifest_json')" class="flex-1 py-1 px-2 font-medium rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
        <i class="fa-solid fa-file-lines"></i>
        <span>manifest.json</span>
      </button>
    </div>

    <!-- Tab Contents Container -->
    <div class="flex-1 min-h-[300px] overflow-y-auto custom-scrollbar pr-1">
      
      <!-- VIEW 1: STORY (CHAPTERS WITH SUBTITLES & SPOKEN NARRATION) -->
      <div id="script-drawer-view-story" class="space-y-2.5">
        <div id="script-drawer-chapters-list" class="space-y-2">
          <!-- Rendered dynamically by populateScriptDrawerChapters -->
        </div>
      </div>

      <!-- VIEW 2: VISUAL MULTI-SHOT SCREENPLAY (EXPANDED SHOTS & MOVEMENTS) -->
      <div id="script-drawer-view-visual" class="space-y-2 hidden">
        <div id="script-drawer-scenes-list" class="space-y-2">
          <!-- Rendered dynamically by populateScriptDrawerScenes -->
        </div>
      </div>

      <!-- VIEW 3: INPUTS JSON -->
      <div id="script-drawer-view-inputs" class="hidden">
        <pre id="script-drawer-inputs-code" class="w-full p-3 bg-slate-950 border border-[var(--border)] rounded-xl text-emerald-400 font-mono text-[10px] whitespace-pre-wrap leading-relaxed max-h-[55vh] overflow-y-auto select-all"></pre>
      </div>

      <!-- VIEW 4: SCREENPLAY JSON -->
      <div id="script-drawer-view-screenplay" class="hidden">
        <pre id="script-drawer-screenplay-code" class="w-full p-3 bg-slate-950 border border-[var(--border)] rounded-xl text-amber-400 font-mono text-[10px] whitespace-pre-wrap leading-relaxed max-h-[55vh] overflow-y-auto select-all"></pre>
      </div>

      <!-- VIEW 5: PIPELINE STATE JSON -->
      <div id="script-drawer-view-pipeline" class="hidden">
        <pre id="script-drawer-pipeline-code" class="w-full p-3 bg-slate-950 border border-[var(--border)] rounded-xl text-purple-400 font-mono text-[10px] whitespace-pre-wrap leading-relaxed max-h-[55vh] overflow-y-auto select-all"></pre>
      </div>

      <!-- VIEW 6: MANIFEST JSON -->
      <div id="script-drawer-view-manifest" class="hidden">
        <pre id="script-drawer-manifest-code" class="w-full p-3 bg-slate-950 border border-[var(--border)] rounded-xl text-indigo-400 font-mono text-[10px] whitespace-pre-wrap leading-relaxed max-h-[55vh] overflow-y-auto select-all"></pre>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="flex items-center justify-between gap-2 pt-2 border-t border-[var(--border)] shrink-0">
      <div class="flex items-center gap-1.5">
        <button type="button" id="btn-copy-storyboard-bottom" onclick="copyScriptDrawerContent()" class="btn-runway-secondary py-1 px-2.5 text-xs font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-copy text-xs"></i>
          <span>Copy Story</span>
        </button>
      </div>
      <button type="button" onclick="closeScriptDrawer()" class="btn-runway-primary py-1 px-3 text-xs font-bold">
        <span>Close</span>
      </button>
    </div>
  </div>
</div>
