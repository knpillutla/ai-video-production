<!-- HERO MASTER 4K CINEMA PLAYER & FAL.AI-STYLE RESULT CARD -->
<div id="panel-hero-result-section" class="space-y-1.5 hidden">
  <div class="flex items-center justify-between text-xs font-bold text-[var(--text)]">
    <div class="flex items-center gap-2">
      <span class="stage-header-title"><i class="fa-solid fa-crown text-xs text-[var(--text-muted)]"></i> Result</span>
      <span id="panel-player-status-badge" class="px-2 py-0.5 rounded-md text-xs font-mono font-bold bg-[var(--card-subtle)] text-[var(--text-muted)] border border-[var(--border)]">Idle</span>
    </div>
    <div class="flex items-center gap-1">
      <button type="button" onclick="openActiveMasterVideoInPopup()" class="btn-runway-secondary py-0.5 px-2 text-xs" title="Open Preview Player">
        <i class="fa-solid fa-image text-[10px]"></i>
        <span>Preview</span>
      </button>
      <button type="button" onclick="openActiveEpisodeModal()" class="btn-runway-secondary py-0.5 px-2 text-xs" title="View Episode JSON Manifest">
        <i class="fa-solid fa-code text-[10px]"></i>
        <span>JSON</span>
      </button>
    </div>
  </div>

  <div class="relative bg-[var(--card)] rounded-xl overflow-hidden aspect-video min-h-[175px] max-h-[220px] border border-[var(--border)] shadow-sm group flex items-center justify-center">
    <video id="studio-panel-video" controls playsinline preload="none" class="w-full h-full object-contain block bg-black"></video>

    <!-- Empty Idle State -->
    <div id="studio-panel-empty-overlay" class="absolute inset-0 bg-[var(--card)] flex flex-col items-center justify-center p-4 text-center space-y-2">
      <div class="w-10 h-10 rounded-full bg-[var(--card-subtle)] border border-[var(--border)] flex items-center justify-center text-[var(--text-muted)]">
        <i class="fa-solid fa-film text-base"></i>
      </div>
      <div>
        <div class="font-bold text-[var(--text)] text-xs">No Master Video Yet</div>
        <div class="text-xs text-[var(--text-muted)] mt-0.5">Click Run (Ctrl+Enter) to begin autonomous generation</div>
      </div>
    </div>

    <!-- Fal.ai-Grade Active Progress Overlay -->
    <div id="studio-panel-processing-overlay" class="hidden absolute inset-0 bg-[var(--card)] flex flex-col items-center justify-center p-4 text-center space-y-3 z-20">
      <div class="fal-spinner">
        <div class="fal-spinner-ring"></div>
        <div class="fal-spinner-core">
          <i class="fa-solid fa-sparkles text-[10px]"></i>
        </div>
      </div>

      <div class="space-y-1 w-full max-w-[280px]">
        <div id="studio-panel-processing-title" class="font-bold text-[var(--text)] text-sm tracking-tight">AI Pipeline Active</div>
        <div id="studio-panel-processing-subtitle" class="text-xs text-[var(--text-muted)] font-medium leading-tight">Synthesizing 4K Master...</div>
      </div>

      <!-- Sleek Progress Bar Track -->
      <div class="fal-progress-track">
        <div id="studio-panel-progress-bar" class="fal-progress-fill" style="width: 40%;"></div>
      </div>

      <div class="flex items-center justify-between w-full max-w-[260px] text-[10px] font-mono text-[var(--text-muted)]">
        <span id="studio-panel-stage-step">Stage 2 of 5</span>
        <span id="studio-panel-stage-pct">40%</span>
      </div>
    </div>
  </div>
</div>
