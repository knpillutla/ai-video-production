<!-- PANEL 2: PRODUCTION CONTROLS & SYNTHESIS ENGINE (Center Panel) -->
<div class="h-full flex flex-col bg-[var(--card)] border border-[var(--border)] rounded-2xl p-2.5 shadow-sm space-y-2 overflow-y-auto custom-scrollbar">
  <!-- Top Profile Switcher & Preferences Header -->
  <div class="flex items-center justify-between border-b border-[var(--border)] pb-1.5">
    <div class="flex items-center gap-1">
      <i class="fa-solid fa-sliders text-indigo-600 dark:text-indigo-400 text-[10px]"></i>
      <span class="text-[11px] font-bold text-slate-900 dark:text-gray-200">Controls</span>
    </div>

    <!-- Presets & Preferences Actions -->
    <div class="flex items-center gap-0.5">
      <select id="studio-profile-selector" onchange="onProfileSelectChange(this.value)" class="px-1.5 py-0.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded text-[9px] font-bold focus:outline-none focus:border-indigo-500">
        <option value="presets">⚡ Presets</option>
      </select>
      <button type="button" onclick="openSavePreferenceModal()" class="p-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-[9px] font-bold transition shadow-sm" title="Save Custom Profile">
        <i class="fa-solid fa-bookmark text-[8px]"></i>
      </button>
      <button type="button" onclick="resetToStudioPresets()" class="p-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-gray-300 rounded text-[9px] font-bold border border-slate-300 dark:border-slate-700" title="Reset to Defaults">
        <i class="fa-solid fa-rotate-left text-[8px]"></i>
      </button>
    </div>
  </div>

  <!-- SECTION 1: PRODUCTION TIERS -->
  <div class="space-y-1">
    <div class="flex items-center justify-between text-[10px] font-bold text-slate-900 dark:text-gray-200">
      <span>1. Tier:</span>
      <span id="tier-active-badge" class="font-mono text-[9px] text-purple-600 dark:text-purple-400">4K Master ($0.45)</span>
    </div>
    <div class="grid grid-cols-3 gap-1">
      <!-- Low Cost -->
      <div onclick="selectProductionTier('low_cost')" id="tier-card-low_cost" class="p-1.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 hover:border-emerald-500 rounded-lg cursor-pointer transition text-center space-y-0.2">
        <div class="font-bold text-emerald-600 dark:text-emerald-400 text-[10px]">Draft</div>
        <div class="font-mono text-[9px] text-slate-900 dark:text-white font-bold">$0.02</div>
        <input type="radio" id="tier-radio-low_cost" name="tier_choice" value="low_cost" class="accent-emerald-500 hidden">
      </div>
      <!-- Balanced -->
      <div onclick="selectProductionTier('balanced')" id="tier-card-balanced" class="p-1.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 rounded-lg cursor-pointer transition text-center space-y-0.2">
        <div class="font-bold text-indigo-700 dark:text-indigo-300 text-[10px]">Balanced</div>
        <div class="font-mono text-[9px] text-slate-900 dark:text-white font-bold">$0.14</div>
        <input type="radio" id="tier-radio-balanced" name="tier_choice" value="balanced" class="accent-indigo-500 hidden">
      </div>
      <!-- Cinematic / 4K Master -->
      <div onclick="selectProductionTier('cinematic')" id="tier-card-cinematic" class="p-1.5 bg-purple-50 dark:bg-purple-950/40 border-2 border-purple-500 rounded-lg cursor-pointer transition text-center space-y-0.2 ring-1 ring-purple-500/40">
        <div class="font-bold text-purple-600 dark:text-purple-300 text-[10px]">4K Master</div>
        <div class="font-mono text-[9px] text-slate-900 dark:text-white font-bold">$0.45</div>
        <input type="radio" id="tier-radio-cinematic" name="tier_choice" value="cinematic" checked class="accent-purple-500 hidden">
      </div>
    </div>
  </div>

  <!-- SECTION 2: EXECUTION MODE (Test vs Production) & PIPELINE GATE (Auto vs Manual) -->
  <div class="space-y-1.5">
    <div class="flex items-center justify-between text-[10px] font-bold text-slate-900 dark:text-gray-200">
      <span class="flex items-center gap-1">
        <i class="fa-solid fa-bolt-lightning text-amber-500 text-[9px]"></i>
        <span>2. Mode:</span>
      </span>
      <div class="inline-flex items-center p-0.5 bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded">
        <button type="button" onclick="setExecutionMode('test')" id="btn-exec-test" class="px-1.5 py-0.2 text-[9px] font-bold rounded bg-amber-600 text-white shadow">🧪 Test</button>
        <button type="button" onclick="setExecutionMode('prod')" id="btn-exec-prod" class="px-1.5 py-0.2 text-[9px] font-medium text-slate-600 dark:text-gray-400 hover:text-white rounded">🚀 Prod</button>
      </div>
    </div>

    <!-- Pipeline Gate (Auto vs Manual Stage-Gate) -->
    <div class="flex items-center justify-between text-[10px] font-bold text-slate-900 dark:text-gray-200 bg-slate-50 dark:bg-slate-950/60 p-1 rounded-lg border border-slate-200 dark:border-slate-800">
      <span class="flex items-center gap-1">
        <i class="fa-solid fa-code-branch text-purple-600 dark:text-purple-400 text-[9px]"></i>
        <span class="text-[9px]">Gate:</span>
      </span>
      <div class="inline-flex items-center p-0.5 bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded">
        <button type="button" onclick="setPipelineExecutionMode('auto')" id="btn-pipe-auto" class="px-1.5 py-0.2 text-[9px] font-medium text-slate-600 dark:text-gray-400 hover:text-white rounded" title="Autonomous end-to-end rendering">⚡ Auto</button>
        <button type="button" onclick="setPipelineExecutionMode('manual')" id="btn-pipe-manual" class="px-1.5 py-0.2 text-[9px] font-bold rounded bg-purple-600 text-white shadow" title="Stage-by-stage curation & review">🛠️ Manual</button>
      </div>
    </div>

    <!-- Test Duration & Shots Options (Shown when in Test Mode) -->
    <div id="exec-options-test" class="p-1.5 bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 rounded-xl space-y-1">
      <div class="grid grid-cols-2 gap-1">
        <select id="studio-test-shots" onchange="setTestShots(this.value)" class="w-full px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded text-slate-900 dark:text-white text-[9px] font-semibold">
          <option value="1" selected>1 Shot (Cineloop)</option>
          <option value="2">2 Shots (Dual Angle)</option>
          <option value="3">3 Shots (3-Angle)</option>
          <option value="4">4 Shots (4-Hub)</option>
        </select>
        <select id="studio-test-stretch" onchange="setBroadcastHours(this.value)" class="w-full px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded text-slate-900 dark:text-white text-[9px] font-semibold">
          <option value="0" selected>Draft (5s/10s)</option>
          <option value="1.0">1 Hr Stream</option>
          <option value="3.0">3 Hr (YouTube Std)</option>
          <option value="8.0">8 Hr (Overnight)</option>
        </select>
      </div>
    </div>

    <!-- Production Master Duration (Shown when in Production Mode) -->
    <div id="exec-options-prod" class="p-1.5 bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 rounded-xl space-y-1 hidden">
      <div class="grid grid-cols-2 gap-1">
        <select id="studio-prod-shots" onchange="calculateLiveCostEstimate()" class="w-full px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded text-slate-900 dark:text-white text-[9px] font-semibold">
          <option value="1" selected>1 Shot (Cineloop)</option>
          <option value="2">2 Shots (Dual Angle)</option>
          <option value="3">3 Shots (3-Angle)</option>
          <option value="4">4 Shots (Full Journey)</option>
        </select>
        <select id="studio-stretch-hours" onchange="onStudioDurationDropdownChange(this.value)" class="w-full px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded text-slate-900 dark:text-white text-[9px] font-semibold">
          <option value="0">Short Master (90s)</option>
          <option value="1.0">1 Hour Stream</option>
          <option value="3.0" selected>3 Hours (4K Broadcast)</option>
          <option value="8.0">8 Hours (Overnight)</option>
        </select>
      </div>
      <!-- Inline Custom Duration Input (Visible only when 'custom' is selected) -->
      <div id="studio-custom-duration-container" class="hidden flex items-center justify-between gap-1 pt-0.5 px-0.5 bg-slate-100 dark:bg-slate-900 rounded-lg p-1 border border-indigo-500/30">
        <span class="text-[9px] font-bold text-indigo-600 dark:text-indigo-400 font-mono flex items-center gap-1"><i class="fa-solid fa-clock text-[8px]"></i> Custom:</span>
        <div class="flex items-center gap-1">
          <input type="number" id="studio-custom-minutes-input" min="1" max="180" value="20" oninput="calculateLiveCostEstimate()" class="w-12 px-1 py-0.5 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded text-slate-900 dark:text-white text-[9px] font-mono font-bold text-right outline-none focus:border-indigo-500">
          <select id="studio-custom-unit-select" onchange="calculateLiveCostEstimate()" class="px-1 py-0.5 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded text-slate-900 dark:text-white text-[9px] font-bold outline-none focus:border-indigo-500">
            <option value="mins" selected>mins</option>
            <option value="hours">hours</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION 3: STEM MODALITY MATRIX & CINEMATIC SPECS -->
  <div class="space-y-1">
    <span class="text-[10px] font-bold text-slate-900 dark:text-gray-200">3. Stems &amp; Specs:</span>
    <div class="grid grid-cols-2 gap-1 text-[10px]">
      <label class="flex items-center gap-1 p-0.5 bg-slate-50 dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800 cursor-pointer"><input type="checkbox" id="studio-toggle-bgm" checked class="accent-indigo-600 scale-90"><span class="truncate">BGM</span></label>
      <label class="flex items-center gap-1 p-0.5 bg-slate-50 dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800 cursor-pointer"><input type="checkbox" id="studio-toggle-voice-over" class="accent-indigo-600 scale-90"><span class="truncate">Voiceover</span></label>
      <label class="flex items-center gap-1 p-0.5 bg-slate-50 dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800 cursor-pointer"><input type="checkbox" id="studio-toggle-tts" class="accent-indigo-600 scale-90"><span class="truncate">TTS</span></label>
      <label class="flex items-center gap-1 p-0.5 bg-slate-50 dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800 cursor-pointer" title="Enable local steadycam zoom-pan fallback if live AI video diffusion is unavailable"><input type="checkbox" id="studio-toggle-fallback" class="accent-amber-600 scale-90"><span class="truncate text-amber-700 dark:text-amber-400 font-semibold">Fallback</span></label>
    </div>

    <div class="grid grid-cols-2 gap-1 pt-0.5" id="studio-specs-row-2">
      <div id="studio-camera-motion-wrap" class="hidden">
        <select id="studio-camera-motion" class="w-full px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded text-slate-900 dark:text-white text-[9px] font-semibold" title="Camera Motion & Framing Style">
          <option value="locked_tripod" selected>🔒 Fixed Locked Tripod</option>
          <option value="dual_perspective">🔭 Dual (Wide + Close-up)</option>
          <option value="slow_steadycam">🚶 Slow Steadycam (1.5km/h)</option>
          <option value="aerial_crane">🦅 Slow Aerial Glide</option>
        </select>
      </div>
      <select id="studio-fps" class="w-full col-span-2 px-1.5 py-0.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded text-slate-900 dark:text-white text-[9px] font-semibold">
        <option value="24" selected>24 fps (Cinematic 4K)</option>
        <option value="30">30 fps (Broadcast)</option>
        <option value="60">60 fps (Fluid)</option>
      </select>
    </div>
  </div>

  <!-- SECTION 4: LIVE PRE-FLIGHT COST & GRAND ACTION BUTTON -->
  <div class="pt-1 border-t border-[var(--border)] space-y-1.5 mt-auto">
    <div class="flex items-center justify-between px-0.5">
      <span class="text-[9px] text-slate-600 dark:text-gray-400 font-mono">Estimate:</span>
      <span id="studio-live-cost-badge" class="font-mono font-bold text-[10px] text-emerald-700 dark:text-emerald-400">$0.04 USD (1 Shot (Draft))</span>
    </div>
    
    <div class="flex items-center gap-1">
      <button id="btn-guided-generate" onclick="quickTestProduceFromPrompt()" class="flex-1 py-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-black rounded-xl text-[11px] flex items-center justify-center gap-1.5 transition shadow shadow-indigo-600/30 active:scale-95 group">
        <i class="fa-solid fa-bolt text-yellow-300 group-hover:scale-110 transition-transform text-[10px]"></i>
        <span id="btn-produce-text">TEST (MANUAL 1 Shots)</span>
      </button>
      <button type="button" id="btn-studio-stop" onclick="stopStudioProduction(currentActiveInspectorEpisode ? (currentActiveInspectorEpisode.id || currentActiveInspectorEpisode.episode_id) : 'EP-001')" class="px-2.5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-[10px] flex items-center justify-center gap-1 transition shadow-sm active:scale-95" title="Stop Production">
        <i class="fa-solid fa-stop text-[9px]"></i>
        <span>Stop</span>
      </button>
      <button type="button" id="btn-studio-resume" onclick="resumeStudioProduction(currentActiveInspectorEpisode ? (currentActiveInspectorEpisode.id || currentActiveInspectorEpisode.episode_id) : 'EP-001')" class="px-2.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-[10px] flex items-center justify-center gap-1 transition shadow-sm active:scale-95" title="Resume Production (--id resumption)">
        <i class="fa-solid fa-play text-[9px]"></i>
        <span>Resume</span>
      </button>
    </div>

    <!-- Approval Action Box for Active Episode -->
    <div id="studio-approval-container" class="pt-1.5 border-t border-[var(--border)] flex items-center justify-between gap-1.5 hidden">
      <div class="flex items-center gap-1">
        <span class="text-[9px] font-bold text-slate-700 dark:text-gray-300">Status:</span>
        <span id="studio-approval-tag" class="text-[9px] font-mono font-bold px-1.5 py-0.2 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-400 border border-amber-500/30">⏳ Unapproved</span>
      </div>
      <button type="button" id="btn-studio-approve" onclick="approveCurrentEpisode()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-[10px] flex items-center gap-1 transition shadow-sm active:scale-95">
        <i class="fa-solid fa-circle-check text-[9px]"></i>
        <span id="btn-studio-approve-text">Approve Master Video</span>
      </button>
    </div>
  </div>
</div>
