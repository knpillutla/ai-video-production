<!-- PANEL 2: PRODUCTION CONTROLS & SYNTHESIS ENGINE (Center Panel) -->
<div class="h-full flex flex-col bg-[var(--card)] border border-[var(--border)] rounded-2xl p-2.5 shadow-sm space-y-2.5 overflow-y-auto custom-scrollbar">
  <!-- Top Profile Switcher & Preferences Header -->
  <div class="flex items-center justify-between border-b border-[var(--border)] pb-1.5">
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-sliders text-[var(--text-muted)] text-xs"></i>
      <span class="text-xs font-bold text-[var(--text)]">Controls</span>
    </div>

    <!-- Presets & Preferences Actions -->
    <div class="flex items-center gap-1">
      <select id="studio-profile-selector" onchange="onProfileSelectChange(this.value)" class="px-2 py-0.5 bg-[var(--card-subtle)] border border-[var(--border)] text-[var(--text)] rounded text-xs font-semibold focus:outline-none focus:border-[var(--accent)]">
        <option value="presets">⚡ Presets</option>
      </select>
      <button type="button" onclick="openSavePreferenceModal()" class="btn-runway-secondary py-0.5 px-2 text-xs" title="Save Custom Profile">
        <i class="fa-solid fa-bookmark text-[10px]"></i>
      </button>
      <button type="button" onclick="resetToStudioPresets()" class="btn-runway-secondary py-0.5 px-2 text-xs" title="Reset to Defaults">
        <i class="fa-solid fa-rotate-left text-[10px]"></i>
      </button>
    </div>
  </div>

  <!-- SECTION 1: PRODUCTION TIERS -->
  <div class="space-y-1">
    <div class="flex items-center justify-between text-xs font-bold text-[var(--text)]">
      <span>1. Tier:</span>
      <span id="tier-active-badge" class="font-mono text-xs text-[var(--accent)]">4K Master ($0.45)</span>
    </div>
    <div class="grid grid-cols-3 gap-1.5">
      <!-- Low Cost -->
      <div onclick="selectProductionTier('low_cost')" id="tier-card-low_cost" class="tier-card-option">
        <div class="font-bold text-xs text-[var(--text)]">Draft</div>
        <div class="font-mono text-xs text-[var(--text-muted)] font-bold">$0.02</div>
        <input type="radio" id="tier-radio-low_cost" name="tier_choice" value="low_cost" class="hidden">
      </div>
      <!-- Balanced -->
      <div onclick="selectProductionTier('balanced')" id="tier-card-balanced" class="tier-card-option">
        <div class="font-bold text-xs text-[var(--text)]">Balanced</div>
        <div class="font-mono text-xs text-[var(--text-muted)] font-bold">$0.14</div>
        <input type="radio" id="tier-radio-balanced" name="tier_choice" value="balanced" class="hidden">
      </div>
      <!-- Cinematic / 4K Master -->
      <div onclick="selectProductionTier('cinematic')" id="tier-card-cinematic" class="tier-card-option active">
        <div class="font-bold text-xs text-[var(--text)]">4K Master</div>
        <div class="font-mono text-xs text-[var(--text-muted)] font-bold">$0.45</div>
        <input type="radio" id="tier-radio-cinematic" name="tier_choice" value="cinematic" checked class="hidden">
      </div>
    </div>
  </div>

  <!-- SECTION 2: EXECUTION MODE & PIPELINE GATE -->
  <div class="space-y-1.5">
    <div class="flex items-center justify-between text-xs font-bold text-[var(--text)]">
      <span class="flex items-center gap-1">
        <i class="fa-solid fa-bolt text-[var(--text-muted)] text-[10px]"></i>
        <span>2. Mode:</span>
      </span>
      <div class="segmented-track">
        <button type="button" onclick="setExecutionMode('test')" id="btn-exec-test" class="segmented-btn active">🧪 Test</button>
        <button type="button" onclick="setExecutionMode('prod')" id="btn-exec-prod" class="segmented-btn">🚀 Prod</button>
      </div>
    </div>

    <!-- Pipeline Gate (Auto vs Manual Stage-Gate) -->
    <div class="flex items-center justify-between text-xs font-bold text-[var(--text)] bg-[var(--card-subtle)] p-1.5 rounded-xl border border-[var(--border)]">
      <span class="flex items-center gap-1">
        <i class="fa-solid fa-code-branch text-[var(--text-muted)] text-[10px]"></i>
        <span>Gate:</span>
      </span>
      <div class="segmented-track">
        <button type="button" onclick="setPipelineExecutionMode('auto')" id="btn-pipe-auto" class="segmented-btn" title="Autonomous end-to-end rendering">⚡ Auto</button>
        <button type="button" onclick="setPipelineExecutionMode('manual')" id="btn-pipe-manual" class="segmented-btn active" title="Stage-by-stage curation & review">🛠️ Manual</button>
      </div>
    </div>

    <!-- Test Duration & Shots Options -->
    <div id="exec-options-test" class="p-1.5 bg-[var(--card-subtle)] border border-[var(--border)] rounded-xl space-y-1">
      <div class="grid grid-cols-2 gap-1.5">
        <select id="studio-test-shots" onchange="setTestShots(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold">
          <option value="1" selected>1 Shot (Cineloop)</option>
          <option value="2">2 Shots (Dual Angle)</option>
          <option value="3">3 Shots (3-Angle)</option>
          <option value="4">4 Shots (4-Hub)</option>
        </select>
        <select id="studio-test-stretch" onchange="setBroadcastHours(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold">
          <option value="0" selected>Draft (5s/10s)</option>
          <option value="0.033">2 Min Preview (120s)</option>
          <option value="1.0">1 Hr Stream</option>
          <option value="3.0">3 Hr (YouTube Std)</option>
          <option value="8.0">8 Hr (Overnight)</option>
        </select>
      </div>
    </div>

    <!-- Production Master Duration -->
    <div id="exec-options-prod" class="p-1.5 bg-[var(--card-subtle)] border border-[var(--border)] rounded-xl space-y-1 hidden">
      <div class="grid grid-cols-2 gap-1.5">
        <select id="studio-prod-shots" onchange="calculateLiveCostEstimate()" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold">
          <option value="1" selected>1 Shot (Cineloop)</option>
          <option value="2">2 Shots (Dual Angle)</option>
          <option value="3">3 Shots (3-Angle)</option>
          <option value="4">4 Shots (Full Journey)</option>
        </select>
        <select id="studio-stretch-hours" onchange="onStudioDurationDropdownChange(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold">
          <option value="0">Short Master (90s)</option>
          <option value="1.0">1 Hour Stream</option>
          <option value="3.0" selected>3 Hours (4K Broadcast)</option>
          <option value="8.0">8 Hours (Overnight)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SECTION 3: STEM MODALITY MATRIX & CINEMATIC SPECS -->
  <div class="space-y-1">
    <span class="text-xs font-bold text-[var(--text)]">3. Stems &amp; Specs:</span>
    <div class="grid grid-cols-2 gap-1 text-xs">
      <label class="flex items-center gap-1.5 p-1 bg-[var(--card-subtle)] rounded-lg border border-[var(--border)] cursor-pointer"><input type="checkbox" id="studio-toggle-bgm" checked class="accent-[var(--accent)]"><span class="truncate text-[var(--text)]">BGM</span></label>
      <label class="flex items-center gap-1.5 p-1 bg-[var(--card-subtle)] rounded-lg border border-[var(--border)] cursor-pointer"><input type="checkbox" id="studio-toggle-voice-over" class="accent-[var(--accent)]"><span class="truncate text-[var(--text)]">Voiceover</span></label>
      <label class="flex items-center gap-1.5 p-1 bg-[var(--card-subtle)] rounded-lg border border-[var(--border)] cursor-pointer"><input type="checkbox" id="studio-toggle-tts" class="accent-[var(--accent)]"><span class="truncate text-[var(--text)]">TTS</span></label>
      <label class="flex items-center gap-1.5 p-1 bg-[var(--card-subtle)] rounded-lg border border-[var(--border)] cursor-pointer" title="Enable local steadycam zoom-pan fallback if live AI video diffusion is unavailable"><input type="checkbox" id="studio-toggle-fallback" class="accent-[var(--accent)]"><span class="truncate text-[var(--text)] font-semibold">Fallback</span></label>
    </div>

    <div id="studio-dual-editions-row" class="pt-0.5">
      <label class="flex items-center gap-1.5 p-1 bg-[var(--card-subtle)] rounded-lg border border-[var(--border)] cursor-pointer" title="Export separate Music Only (without voiceover) and Narration Only (without music) video editions">
        <input type="checkbox" id="studio-toggle-dual-editions" class="accent-[var(--accent)]">
        <span class="truncate text-[var(--text)] text-[11px] font-semibold">Dual Masters (Music + Narration)</span>
      </label>
    </div>

    <div class="grid grid-cols-2 gap-1.5 pt-0.5" id="studio-specs-row-2">
      <select id="studio-fps" class="w-full col-span-2 px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold">
        <option value="24" selected>24 fps (Cinematic 4K)</option>
        <option value="30">30 fps (Broadcast)</option>
        <option value="60">60 fps (Fluid)</option>
      </select>
    </div>
  </div>

  <!-- SECTION 4: LIVE PRE-FLIGHT COST & ACTION BUTTON -->
  <div class="pt-2 border-t border-[var(--border)] space-y-1.5 mt-auto">
    <div class="flex items-center justify-between px-0.5">
      <span class="text-xs text-[var(--text-muted)] font-mono">Estimate:</span>
      <span id="studio-live-cost-badge" class="font-mono font-bold text-xs text-[var(--text)]">$0.04 USD (1 Shot (Draft))</span>
    </div>
    
    <div class="flex items-center gap-2">
      <button type="button" onclick="clearStudioInputs()" class="btn-runway-secondary" title="Reset Inputs &amp; Controls">
        <span>Reset</span>
      </button>
      <button id="btn-guided-generate" onclick="quickTestProduceFromPrompt()" class="btn-runway-primary flex-1">
        <span id="btn-produce-text">Run</span>
        <span class="kbd-badge">CTRL ↵</span>
      </button>
      <button type="button" id="btn-studio-stop" onclick="stopStudioProduction(currentActiveInspectorEpisode ? (currentActiveInspectorEpisode.id || currentActiveInspectorEpisode.episode_id) : 'EP-001')" class="btn-runway-secondary text-rose-600 hover:text-rose-700 dark:text-rose-400" title="Stop Production">
        <i class="fa-solid fa-stop text-xs"></i>
      </button>
      <button type="button" id="btn-studio-resume" onclick="reprocessActiveEpisodeId(currentActiveInspectorEpisode ? (currentActiveInspectorEpisode.id || currentActiveInspectorEpisode.episode_id) : null)" class="btn-runway-secondary" title="Re-Synthesize and resume episode (--id resumption)">
        <i class="fa-solid fa-arrows-rotate text-xs"></i>
        <span>Re-Synthesize</span>
      </button>
    </div>
  </div>
</div>
