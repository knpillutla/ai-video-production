<!-- PANEL 1: STORY & CREATION HUB (Left Panel: New Production & Channel Archive) -->
<div class="h-full flex flex-col bg-[var(--card)] border border-[var(--border)] rounded-2xl p-2.5 shadow-sm space-y-2 overflow-y-auto custom-scrollbar">
  <!-- Top Header: Panel Title & Tools -->
  <div class="flex items-center justify-between border-b border-[var(--border)] pb-2">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-[var(--accent)]/10 text-[var(--accent)] flex items-center justify-center font-bold text-xs shrink-0">
        <i class="fa-solid fa-clapperboard"></i>
      </div>
      <span class="text-sm font-black text-[var(--text)] tracking-tight">Video Production</span>
    </div>
    
    <div class="flex items-center gap-1 shrink-0">
      <button type="button" onclick="openHierarchyGuideModal()" class="btn-runway-secondary py-1 px-2.5 text-xs text-indigo-400 hover:text-indigo-300" title="Production Hierarchy & Reference Guide">
        <i class="fa-solid fa-circle-question text-[10px]"></i>
        <span>Guide</span>
      </button>
      <button type="button" onclick="applyGenreNichePreset()" class="btn-runway-secondary py-1 px-2.5 text-xs" title="Restore Studio Recommended Presets">
        <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i>
        <span>Presets</span>
      </button>
      <button type="button" onclick="clearStudioInputs()" class="btn-runway-secondary py-1 px-2.5 text-xs" title="Clear Inputs">
        <i class="fa-solid fa-rotate-left text-[10px]"></i>
        <span>Clear</span>
      </button>
    </div>
  </div>

  <!-- Switcher Tabs: New Production vs Existing Episodes -->
  <div class="segmented-track w-full">
    <button type="button" onclick="switchCreationTab('new')" id="btn-tab-creation-new" class="segmented-btn flex-1 justify-center py-1.5 px-3 text-xs font-bold active">
      <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i>
      <span>New</span>
    </button>
    <button type="button" onclick="switchCreationTab('archive')" id="btn-tab-creation-archive" class="segmented-btn flex-1 justify-center py-1.5 px-3 text-xs font-bold">
      <i class="fa-solid fa-film text-[10px]"></i>
      <span>Episodes</span>
      <span id="channel-archive-badge-count" class="px-1.5 py-0.2 rounded-full text-[10px] bg-[var(--card-subtle)] text-[var(--text-muted)] font-mono font-bold">0</span>
    </button>
  </div>

  <!-- VIEW A: NEW PRODUCTION CREATION WORKSPACE -->
  <div id="view-creation-new" class="space-y-2 flex-1 flex flex-col">
    <!-- Mode Pills & Format Switcher in Unified Segmented Control -->
    <div class="flex flex-wrap items-center justify-between gap-1">
      <div class="segmented-track">
        <button type="button" onclick="setCreationMode('theme', true)" id="mode-pill-theme" class="segmented-btn active">
          <i class="fa-solid fa-compass text-[9px]"></i>
          <span>Theme</span>
        </button>
        <button type="button" onclick="setCreationMode('idea', true)" id="mode-pill-idea" class="segmented-btn">
          <i class="fa-solid fa-lightbulb text-[9px]"></i>
          <span>Idea</span>
        </button>
        <button type="button" onclick="setCreationMode('script', true)" id="mode-pill-script" class="segmented-btn">
          <i class="fa-solid fa-scroll text-[9px]"></i>
          <span>Script</span>
        </button>
        <button type="button" onclick="setCreationMode('youtube', true)" id="mode-pill-youtube" class="segmented-btn">
          <i class="fa-brands fa-youtube text-[9px]"></i>
          <span>Ref</span>
        </button>
      </div>

      <!-- Aspect Ratio Switcher -->
      <div class="segmented-track">
        <button type="button" onclick="setStudioFormat('16:9')" id="format-btn-landscape" class="segmented-btn active" title="16:9 4K Video">16:9</button>
        <button type="button" onclick="setStudioFormat('9:16')" id="format-btn-portrait" class="segmented-btn" title="9:16 Short">9:16</button>
        <input type="hidden" id="studio-selected-format" value="16:9">
      </div>
    </div>

    <!-- 1. PRODUCTION FORMAT SELECTOR (Segmented Pill Chips filtered by active Network) -->
    <div class="space-y-1 p-2 bg-[var(--card-subtle)] border border-[var(--border)] rounded-xl">
      <div class="flex items-center justify-between">
        <label class="text-[11px] font-bold text-[var(--text)] flex items-center gap-1.5">
          <i class="fa-solid fa-film text-[10px] text-[var(--accent)]"></i>
          <span>1. Format:</span>
        </label>
        <span id="studio-format-count-badge" class="text-[9px] font-mono text-[var(--text-muted)]">Licensed Formats</span>
      </div>
      <!-- Dynamically rendered segmented pill chips container -->
      <div id="studio-format-chips-container" class="flex items-center gap-1 flex-wrap">
        <!-- Rendered by studio_creation_controller.js -->
      </div>
      <input type="hidden" id="studio-active-format-val" value="relaxation">
    </div>

    <!-- 1B. CONTINENT, COUNTRY, REGION & LANGUAGE SELECTOR (Dynamic 4-Tier Hierarchy) -->
    <div id="studio-country-language-shelf" class="p-2 bg-[var(--card-subtle)] border border-[var(--border)] rounded-xl space-y-1.5 hidden">
      <div class="flex items-center justify-between">
        <label class="text-[11px] font-bold text-[var(--text)] flex items-center gap-1.5">
          <i class="fa-solid fa-earth-americas text-[10px] text-[var(--accent)]"></i>
          <span>Continent, Country, Region &amp; Language:</span>
        </label>
        <span class="text-[9px] font-mono text-[var(--text-muted)]">4-Tier Regional Hierarchy</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-1.5">
        <div>
          <label class="block text-[9px] font-semibold text-[var(--text-muted)] mb-0.5">1. Continent</label>
          <select id="studio-continent-selector" onchange="onStudioContinentChange(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]" title="Select Continent">
            <option value="Asia" selected>🌏 Asia</option>
            <option value="Europe">🌍 Europe</option>
            <option value="North America">🌎 North America</option>
            <option value="South America">🌎 South America</option>
            <option value="Africa">🌍 Africa</option>
            <option value="Oceania">🌏 Oceania</option>
          </select>
        </div>
        <div>
          <label class="block text-[9px] font-semibold text-[var(--text-muted)] mb-0.5">2. Country</label>
          <select id="studio-country-selector" onchange="onStudioCountryChange(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]" title="Select Country"></select>
        </div>
        <div>
          <label class="block text-[9px] font-semibold text-[var(--text-muted)] mb-0.5">3. Country Region / State</label>
          <select id="studio-subregion-selector" onchange="onStudioSubRegionChange(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]" title="Select Country Region"></select>
        </div>
        <div>
          <label class="block text-[9px] font-semibold text-[var(--text-muted)] mb-0.5">4. Language &amp; Heritage</label>
          <select id="studio-region-language-selector" onchange="onStudioLanguageChange(this.value)" class="w-full px-2 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]" title="Select Language"></select>
        </div>
      </div>
    </div>

    <!-- 2. PRODUCTION TITLE & EPISODE NUMBER -->
    <div class="p-2.5 bg-[var(--card-subtle)] border border-[var(--border)] rounded-xl space-y-1.5">
      <div class="flex items-center justify-between">
        <label for="studio-production-name" class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5">
          <i class="fa-solid fa-clapperboard text-xs text-[var(--accent)]"></i>
          <span>2. Production Title:</span>
          <span class="text-[10px] font-normal text-[var(--text-muted)]">(Optional)</span>
        </label>
        <span class="text-[9px] font-mono text-[var(--text-muted)]">Episode Identifier</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-[1fr_95px] gap-2 items-center">
        <div>
          <input type="text" id="studio-production-name" oninput="onNewSeriesNameInput(this.value)" placeholder="Enter title / production name (optional)..." class="w-full px-3 py-1.5 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-medium placeholder-[var(--text-muted)] focus:outline-none focus:border-[var(--accent)]">
        </div>
        <div>
          <input type="text" id="studio-episode-code" placeholder="EP-001" value="EP-001" title="Episode Identifier" class="w-full px-2 py-1.5 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-mono font-bold text-center placeholder-[var(--text-muted)] focus:outline-none focus:border-[var(--accent)]">
        </div>
      </div>
    </div>

    <!-- YouTube URL Box (Visible only in YouTube Reference Mode) -->
    <div id="youtube-url-container" class="space-y-0.5 w-full hidden">
      <label for="youtube-url-input" class="text-xs font-bold text-[var(--text)] flex items-center gap-1">
        <i class="fa-brands fa-youtube text-red-500 text-xs"></i>
        <span>YouTube Ref URL:</span>
      </label>
      <input type="text" id="youtube-url-input" placeholder="Paste YouTube URL..." class="w-full px-2.5 py-1.5 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs placeholder-[var(--text-muted)] focus:outline-none focus:border-[var(--accent)]">
    </div>

    <!-- GENRE, SUB-GENRE & ECOSYSTEM ARCHETYPE SELECTOR SHELF -->
    <div id="theme-genre-shelf" class="p-2 bg-[var(--card-subtle)] border border-[var(--border)] rounded-xl space-y-1.5">
      <!-- 3. Genre Selector (Filtered strictly to active format) -->
      <div class="space-y-0.5">
        <label for="studio-genre-selector" class="text-xs font-bold text-[var(--text)] flex items-center gap-1">
          <i class="fa-solid fa-shapes text-[var(--text-muted)] text-[10px]"></i>
          <span>3. Genre (Category):</span>
        </label>
        <select id="studio-genre-selector" onchange="onGenreChange(this.value)" class="w-full px-2.5 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]">
          <option value="relax/nature" selected>🏔️ Nature &amp; Alpine Sanctuaries (relax/nature)</option>
        </select>
      </div>

      <!-- 4. Sub-Genre Selector (Format & Style) -->
      <div class="space-y-0.5">
        <label for="studio-subgenre-selector" class="text-xs font-bold text-[var(--text)] flex items-center gap-1">
          <i class="fa-solid fa-layer-group text-[var(--text-muted)] text-[10px]"></i>
          <span>4. Sub-Genre (Format &amp; Style):</span>
        </label>
        <select id="studio-subgenre-selector" onchange="onSubGenreChange(this.value)" class="w-full px-2.5 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]">
          <option value="ambient_soundscape" selected>🌲 Ambient Soundscape (4K Living Wallpaper)</option>
          <option value="alpine_nature">🏔️ Alpine Nature &amp; Mountain Sanctuaries (Swiss Alps)</option>
          <option value="waterfall_gorge">🌊 Monumental Waterfall &amp; Cataracts (Niagara / Iguazu)</option>
          <option value="cozy_hearth">🔥 Cozy Campfire &amp; Hearth ASMR (Beach &amp; Shoreline)</option>
          <option value="biophilic_retreat">🌧️ Biophilic Rain Retreat &amp; Veranda</option>
          <option value="zen_garden">🪷 Kyoto Zen Temple &amp; Raked Rock Garden</option>
          <option value="global_healing">✨ Global Sacred Sanctuaries &amp; 528Hz Solfeggio</option>
          <option value="cinematic_doc">🦅 24fps Extreme Climate &amp; Wildlife Expedition</option>
        </select>
      </div>

      <!-- 5. Ecosystem Archetype Selector (Setting Template) -->
      <div class="space-y-0.5">
        <label for="studio-archetype-selector" class="text-xs font-bold text-[var(--text)] flex items-center justify-between">
          <span class="flex items-center gap-1">
            <i class="fa-solid fa-mountain-sun text-[var(--accent)] text-[10px]"></i>
            <span id="studio-archetype-label">5. Archetype (Setting Template):</span>
          </span>
          <span class="text-[9px] font-mono text-[var(--text-muted)]" id="studio-archetype-sublabel">Template</span>
        </label>
        <select id="studio-archetype-selector" onchange="onArchetypeChange(this.value)" class="w-full px-2.5 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]">
          <option value="rainy_cabin_bedroom" selected>🛏️ Glass Cabin Bedroom (Rain on Panoramic Window)</option>
        </select>
      </div>

      <!-- Vocal Performer Modality (Visible ONLY in Music Video format) -->
      <div id="studio-vocal-gender-container" class="space-y-0.5 hidden">
        <label for="studio-vocal-gender-selector" class="text-xs font-bold text-[var(--text)] flex items-center gap-1">
          <i class="fa-solid fa-microphone-lines text-[var(--accent)] text-[10px]"></i>
          <span>Vocal Performer (Modality):</span>
        </label>
        <select id="studio-vocal-gender-selector" class="w-full px-2.5 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs font-semibold focus:outline-none focus:border-[var(--accent)]" title="Select Vocal Performer">
          <option value="female" selected>👩 Solo - Female</option>
          <option value="male">👨 Solo - Male</option>
          <option value="duet">💑 Duet - Male &amp; Female</option>
        </select>
      </div>

      <!-- 7. Weather & Atmosphere Selector -->
      <div class="space-y-0.5 pt-1 border-t border-[var(--border)]">
        <label for="studio-weather-selector" class="text-xs font-bold text-[var(--text)] flex items-center justify-between">
          <span class="flex items-center gap-1"><i class="fa-solid fa-cloud-sun-rain text-[var(--text-muted)] text-[10px]"></i><span>7. Weather &amp; Atmosphere:</span></span>
          <span class="text-[9px] font-mono text-[var(--text-muted)]">Procedural FX</span>
        </label>
        <div class="grid grid-cols-3 gap-1 text-[11px] font-semibold">
          <label class="flex items-center justify-center py-1 px-1 bg-[var(--card)] rounded-md border-2 border-[var(--accent)] cursor-pointer text-[var(--text)]" id="weather-lbl-normal"><input type="radio" name="studio_weather" value="normal" checked onchange="onWeatherChange(this.value)" class="hidden"><span>☀️ Normal</span></label>
          <label class="flex items-center justify-center py-1 px-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)] text-[var(--text)]" id="weather-lbl-rain"><input type="radio" name="studio_weather" value="rain" onchange="onWeatherChange(this.value)" class="hidden"><span>🌧️ Rain</span></label>
          <label class="flex items-center justify-center py-1 px-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)] text-[var(--text)]" id="weather-lbl-snow"><input type="radio" name="studio_weather" value="snow" onchange="onWeatherChange(this.value)" class="hidden"><span>❄️ Snow</span></label>
          <label class="flex items-center justify-center py-1 px-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)] text-[var(--text)]" id="weather-lbl-fog"><input type="radio" name="studio_weather" value="fog" onchange="onWeatherChange(this.value)" class="hidden"><span>🌫️ Mist</span></label>
          <label class="flex items-center justify-center py-1 px-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)] text-[var(--text)]" id="weather-lbl-sunset"><input type="radio" name="studio_weather" value="sunset" onchange="onWeatherChange(this.value)" class="hidden"><span>🌅 Sunset</span></label>
          <label class="flex items-center justify-center py-1 px-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)] text-[var(--text)]" id="weather-lbl-night"><input type="radio" name="studio_weather" value="night" onchange="onWeatherChange(this.value)" class="hidden"><span>🌌 Starlit</span></label>
        </div>
      </div>

      <!-- Relaxation Shot Hold Cadence Radio Group -->
      <div id="relaxation-cadence-container" class="pt-1 border-t border-[var(--border)] space-y-0.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-[var(--text)] flex items-center gap-1"><i class="fa-solid fa-hourglass-half text-[var(--text-muted)] text-[10px]"></i><span>Shot Cadence:</span></span>
          <span class="text-[9px] font-mono text-[var(--text-muted)]">Anti-Fatigue</span>
        </div>
        <div class="grid grid-cols-5 gap-1 text-xs">
          <label class="flex items-center justify-center py-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)]"><input type="radio" name="studio_shot_hold" value="1m" class="hidden"><span class="font-medium text-[var(--text)]">1m</span></label>
          <label class="flex items-center justify-center py-1 bg-[var(--card)] rounded-md border-2 border-[var(--accent)] cursor-pointer"><input type="radio" name="studio_shot_hold" value="3m" checked class="hidden"><span class="font-bold text-[var(--text)]">3m</span></label>
          <label class="flex items-center justify-center py-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)]"><input type="radio" name="studio_shot_hold" value="5m" class="hidden"><span class="font-medium text-[var(--text)]">5m</span></label>
          <label class="flex items-center justify-center py-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)]"><input type="radio" name="studio_shot_hold" value="10m" class="hidden"><span class="font-medium text-[var(--text)]">10m</span></label>
          <label class="flex items-center justify-center py-1 bg-[var(--card)] rounded-md border border-[var(--border)] cursor-pointer hover:border-[var(--accent)]"><input type="radio" name="studio_shot_hold" value="15m" class="hidden"><span class="font-medium text-[var(--text)]">15m</span></label>
        </div>
      </div>
    </div>

    <!-- Main Dynamic Labeled Textarea Box -->
    <div class="space-y-1 flex-1 flex flex-col min-h-0">
      <div class="flex items-center justify-between">
        <label for="youtube-prompt-input" id="prompt-input-label" class="text-xs font-bold text-[var(--text)] flex items-center gap-1">
          <i class="fa-solid fa-compass text-[var(--text-muted)] text-xs"></i>
          <span>Topic / Prompt (Optional):</span>
        </label>
        <span class="text-[9px] font-mono text-[var(--text-muted)]">Autonomously derived if empty</span>
      </div>
      <div class="relative flex-1 min-h-[55px]">
        <textarea id="youtube-prompt-input" rows="2" placeholder="Optional: Enter custom theme, mood, or leave empty to use channel default..." class="w-full h-full min-h-[55px] p-2.5 bg-[var(--card)] border border-[var(--border)] rounded-xl text-[var(--text)] text-xs placeholder-[var(--text-muted)] focus:outline-none focus:border-[var(--accent)] transition resize-none"></textarea>
      </div>
    </div>

    <!-- 1-Click Creative Presets Filmstrip -->
    <div class="space-y-0.5 pt-0.5">
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-[var(--text)] flex items-center gap-1">
          <i class="fa-solid fa-sparkles text-[var(--text-muted)] text-[10px]"></i>
          <span id="creative-presets-title">Inspiration Presets</span>
        </span>
        <button onclick="openCreateVideoWizardModal()" class="text-xs text-[var(--accent)] hover:underline font-semibold">Wizard &rarr;</button>
      </div>
      <div id="creative-templates-container" class="grid grid-cols-2 gap-1.5"></div>
    </div>
  </div>

  <!-- VIEW B: CHANNEL ARCHIVE / EXISTING PRODUCTIONS (Lazy-Loaded) -->
  <div id="view-creation-archive" class="space-y-1.5 flex-1 hidden">
    <!-- Format Filter Pills Container -->
    <div id="archive-format-pills" class="flex items-center gap-1 overflow-x-auto pb-1 custom-scrollbar text-[10px] w-full"></div>
    <div class="flex items-center justify-between gap-1">
      <input type="text" id="archive-filter-search" oninput="filterChannelArchive()" placeholder="Search episodes..." class="w-full px-2.5 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-[var(--text)] text-xs">
    </div>
    <div id="channel-archive-list-container" class="space-y-1 overflow-y-auto max-h-[500px] custom-scrollbar pr-0.5">
      <!-- Injected dynamically by JS -->
    </div>
  </div>
</div>
