<!-- 3 Production Tier Selectors (Required for tests and UI) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1">
  <!-- Low Cost Card -->
  <div onclick="selectProductionTier('low_cost')" id="tier-card-low_cost" class="tier-card-option p-3 rounded-xl cursor-pointer transition">
    <div id="guided-card-low_cost" class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <input type="radio" id="tier-radio-low_cost" name="tier_choice" value="low_cost" class="accent-[var(--accent)]">
        <span class="font-bold text-[var(--text)] text-xs">Low-Cost Test</span>
      </div>
      <span class="font-mono font-bold text-[var(--text)] text-xs">$0.02 USD</span>
    </div>
    <p class="text-[10px] text-[var(--text-muted)] mt-1">Fal FLUX.1-dev • 10s Draft Test • Azure TTS</p>
  </div>

  <!-- Balanced Card -->
  <div onclick="selectProductionTier('balanced')" id="tier-card-balanced" class="tier-card-option active p-3 rounded-xl cursor-pointer transition">
    <div id="guided-card-balanced" class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <input type="radio" id="tier-radio-balanced" name="tier_choice" value="balanced" checked class="accent-[var(--accent)]">
        <span class="font-bold text-[var(--text)] text-xs">Balanced Creator</span>
      </div>
      <span class="font-mono font-bold text-[var(--text)] text-xs">$0.14 USD</span>
    </div>
    <p class="text-[10px] text-[var(--text-muted)] mt-1">FLUX Dev • Azure Speech • YouTube Ready</p>
  </div>

  <!-- Cinematic Card -->
  <div onclick="selectProductionTier('cinematic')" id="tier-card-cinematic" class="tier-card-option p-3 rounded-xl cursor-pointer transition">
    <div id="guided-card-cinematic" class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <input type="radio" id="tier-radio-cinematic" name="tier_choice" value="cinematic" class="accent-[var(--accent)]">
        <span class="font-bold text-[var(--text)] text-xs">Cinematic 4K</span>
      </div>
      <span class="font-mono font-bold text-[var(--text)] text-xs">$0.45 USD</span>
    </div>
    <p class="text-[10px] text-[var(--text-muted)] mt-1">FLUX Pro • Suno BGM • 4K Master</p>
  </div>
</div>
