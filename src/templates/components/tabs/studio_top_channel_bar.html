<!-- TOP CHANNEL SWITCHER STRIP (Compact Single-Row Context Bar) -->
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3 py-1.5 shadow-sm flex flex-wrap items-center justify-between gap-2">
  <div class="flex items-center gap-2.5 flex-wrap">
    <span class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-tower-broadcast text-indigo-600 dark:text-indigo-400 text-xs"></i>
      <span>Active Channel:</span>
    </span>

    <!-- Channel Dropdown Selector -->
    <select id="studio-channel-select" onchange="selectStudioChannel(this.value)" class="px-3 py-1 bg-white dark:bg-slate-900 border border-[var(--border)] rounded-lg text-xs font-bold text-[var(--text)] focus:outline-none focus:border-indigo-500 shadow-sm cursor-pointer min-w-[190px]">
      <option value="earth_serenade" selected>Earth Serenade (4K Nature)</option>
      <option value="silent_hearth">Silent Hearth (Fire &amp; ASMR)</option>
      <option value="cineai_docs">CineAI Docs (24fps BBC)</option>
      <option value="telugu_comedy">Comedy Satire (9:16 Shorts)</option>
    </select>

    <span id="studio-channel-meta-badge" class="px-2.5 py-0.5 rounded-md text-[10px] font-mono font-bold bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
      Earth Serenade (@EarthSerenade4K)
    </span>
  </div>

  <div class="flex items-center gap-2 shrink-0">
    <button type="button" onclick="reprocessActiveEpisodeId()" class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold transition flex items-center gap-1 shadow-sm border border-emerald-500/50 active:scale-95" title="Approve and Rerender (--id) — Resumes active episode to completion">
      <i class="fa-solid fa-play text-[8px]"></i>
      <span>Approve &amp; Rerender</span>
    </button>
    <button onclick="switchTab('ledger')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800/80 dark:hover:bg-slate-700 text-indigo-700 dark:text-indigo-300 rounded-lg text-xs font-bold flex items-center gap-1 border border-[var(--border)] transition" title="View Production Ledger">
      <i class="fa-solid fa-list-check text-[10px]"></i>
      <span>Ledger</span>
    </button>
  </div>
</div>
