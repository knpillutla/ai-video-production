<!-- TOP CHANNEL SWITCHER STRIP (Compact Single-Row Context Bar) -->
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3 py-1.5 shadow-sm flex flex-wrap items-center justify-between gap-2">
  <div class="flex items-center gap-2.5 flex-wrap">
    <span class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-tower-broadcast text-[var(--text-muted)] text-xs"></i>
      <span>Active Channel:</span>
    </span>

    <!-- Channel Dropdown Selector -->
    <select id="studio-channel-select" onchange="selectStudioChannel(this.value)" class="px-3 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-xs font-semibold text-[var(--text)] focus:outline-none focus:border-[var(--accent)] shadow-sm cursor-pointer min-w-[200px]">
      <option value="earth_serenade" selected>Earth Serenade (4K Nature)</option>
      <option value="silent_hearth">Silent Hearth (Fire &amp; ASMR)</option>
      <option value="cineai_docs">CineAI Docs (24fps BBC)</option>
      <option value="telugu_comedy">Comedy Satire (9:16 Shorts)</option>
    </select>

    <span id="studio-channel-meta-badge" class="px-2.5 py-0.5 rounded-md text-xs font-mono font-medium bg-[var(--card-subtle)] text-[var(--text-secondary)] border border-[var(--border)]">
      Earth Serenade (@EarthSerenade4K)
    </span>
  </div>

  <div class="flex items-center gap-2 shrink-0">
    <button type="button" onclick="reprocessActiveEpisodeId()" class="btn-runway-primary py-1 px-3 text-xs" title="Approve and Rerender (--id)">
      <i class="fa-solid fa-play text-[9px]"></i>
      <span>Approve &amp; Rerender</span>
      <span class="kbd-badge">CTRL ↵</span>
    </button>
    <button onclick="switchTab('ledger')" class="btn-runway-secondary py-1 px-3 text-xs" title="View Production Ledger">
      <i class="fa-solid fa-list-check text-[10px]"></i>
      <span>Ledger</span>
    </button>
  </div>
</div>
